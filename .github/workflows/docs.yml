# Pull requests and pushes to main build the site. Publishing is manual: the
# dispatch checks upstream GitHub releases, updates release notes, and deploys
# the current site after a successful sync.
name: Docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync release notes
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      sha: ${{ steps.publish.outputs.sha }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check release sync token
        env:
          MSL_DOCS_PUSH_TOKEN: ${{ secrets.MSL_DOCS_PUSH_TOKEN }}
        run: |
          if [ -z "$MSL_DOCS_PUSH_TOKEN" ]; then
            echo "::error::Set the MSL_DOCS_PUSH_TOKEN Actions secret to a fine-grained token owned by onexay with Contents: Read and write access to this repository."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN is authenticated as the Actions app, which cannot
          # bypass this personal repository's main ruleset. This token must
          # belong to the repository owner and have contents:write access.
          token: ${{ secrets.MSL_DOCS_PUSH_TOKEN }}
      - name: Update pages from published releases
        run: python3 scripts/update-release-notes.py
      - name: Commit release note updates
        id: publish
        run: |
          if git diff --quiet -- content/docs/release-notes; then
            echo "No new releases to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/docs/release-notes/msl.md content/docs/release-notes/kernel.md content/docs/release-notes/vscode.md
          git commit -s -m "Refresh release notes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: sync
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' ||
       needs.sync.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha || github.sha }}
          fetch-depth: 0          # enableGitInfo: last-updated dates
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install Hugo
        run: |
          V=0.166.0          # the version the site is tested with locally
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v$V/hugo_extended_${V}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - run: hugo --minify
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: public/
          if-no-files-found: error
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with: { path: public }

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
