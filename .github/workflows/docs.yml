# Pull requests and pushes to main build the site. Publishing is manual: the
# dispatch checks upstream GitHub releases, updates release notes, and deploys
# the current site after a successful sync.
name: Docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync release notes
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      sha: ${{ steps.publish.outputs.sha }}
    runs-on: ubuntu-24.04
    steps:
      # The deploy key is a bypass actor on the main ruleset, so this job can
      # push release notes without a pull request.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_NOTES_DEPLOY_KEY }}
      - name: Update pages from published releases
        run: python3 scripts/update-release-notes.py
      - name: Commit release note updates
        id: publish
        run: |
          if git diff --quiet -- docs/release-notes; then
            echo "No new releases to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release-notes/msl.md docs/release-notes/kernel.md docs/release-notes/vscode.md
          git commit -s -m "Refresh release notes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: sync
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' ||
       needs.sync.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha || github.sha }}
          fetch-depth: 0          # enableGitInfo: last-updated dates
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/
          if-no-files-found: error
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with: { path: build }

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
