# Build the site on every push and pull request (a broken relref fails the
# build), and deploy main to GitHub Pages: https://onexay.github.io/msl-docs/
name: Docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # enableGitInfo: last-updated dates
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install Hugo
        run: |
          V=0.166.0          # the version the site is tested with locally
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v$V/hugo_extended_${V}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - run: hugo --minify
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: public/
          if-no-files-found: error
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with: { path: public }

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
