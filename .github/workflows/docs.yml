# Build the site on every push and pull request; a broken relref fails the
# build. The site isn't published yet (no GitHub Pages deploy).
name: Docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # enableGitInfo: last-updated dates
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install Hugo
        run: |
          V=0.166.0          # the version the site is tested with locally
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v$V/hugo_extended_${V}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - run: hugo --minify
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public/
          if-no-files-found: error
